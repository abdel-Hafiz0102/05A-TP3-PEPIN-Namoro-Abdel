<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Acceuil</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Indie+Flower&amp;family=Knewave&amp;family=Story+Script&amp;display=swap"
		rel="stylesheet">

	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<header class=entete-site>
		<div class="container entete-contenu">

			<div class="logo">
				<a href="index.html">

					<img src="img/equigest-logo.png" alt="Acceuil">

				</a>
			</div>

			<nav class="navigation-accueil" aria-label="Navigation principale">
				<a href="#">Employés</a>
				<a href="#">Créeer un employé</a>
				<a href="#">Mon compte</a>
			</nav>

		</div>

	</header>


	<main class="container accueil">
    <h1>Une équipe, une gestion simplifiée!</h1>

    <div class="accueil-colonnes">

        <!-- Colonne gauche : deux photos et le formulaire -->
        <div class="colonne-accueil">
            <div class="rangee-images">
                <img src="img/employes/employe-1.jpg" alt="">
                <img src="img/employes/employe-2.jpg" alt="">
            </div>

            <form class="connexion" aria-labelledby="titre-connexion">
                <h2 id="titre-connexion">Connexion</h2>

                <label for="courriel">Courriel</label>
                <input type="email" id="courriel" name="courriel">

                <label class="souvenir">
                    <input type="checkbox" name="souvenir">
                    Se souvenir de moi
                </label>

                <button type="button">Se connecter</button>
            </form>
        </div>

        <!-- Colonne droite : la grande photo et deux petites photos -->
        <div class="colonne-accueil">
            <img class="image-principale"
                 src="img/employes/employe-3.jpg" alt="">

            <div class="rangee-images">
                <img src="img/employes/employe-4.jpg" alt="">
                <img src="img/employes/employe-5.jpg" alt="">
            </div>
        </div>

    </div>
</main>


	<footer class="pied-site">
    <div class="container">
        <div class="pied-contenu">
            <p>© ÉquiGest · 1600, boulevard de l’Entente</p>

            <a class="pied-telephone" href="tel:+15819228689">
                581-922-8689
            </a>
        </div>

        <p class="pied-credits">
            Site réalisé par Hafiz Namoro |
            Dans le cadre du cours Interfaces Web |
            <a href="https://cegepgarneau.ca/">Cégep Garneau</a>
        </p>
    </div>
</footer>






</body>

</html>
